<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>INFO SEC Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one centered column. Header with subject chips, three mode tabs, set and topic filters, then a single working card. */
:root{
  color-scheme:light;
  --bg:#ECF0F3; --surface:#FFFFFF; --ink:#111A22; --muted:#56646F; --line:#D1D9DF;
  --accent:#C2410C; --accent-ink:#FFFFFF; --tint:#FBE6DA;
  --good:#15803D; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE7E4;
  --f-display:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --surface:#171E26; --ink:#E8EDF2; --muted:#94A1AE; --line:#2A3541;
    --accent:#FF9A5C; --accent-ink:#1A0D04; --tint:#3A2315;
    --good:#4ADE80; --good-bg:#12331F; --bad:#F87171; --bad-bg:#3A1A18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#171E26; --ink:#E8EDF2; --muted:#94A1AE; --line:#2A3541;
  --accent:#FF9A5C; --accent-ink:#1A0D04; --tint:#3A2315;
  --good:#4ADE80; --good-bg:#12331F; --bad:#F87171; --bad-bg:#3A1A18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 56px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:18px}

header{display:grid;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem;max-width:56ch}
.chips-h{display:flex;flex-wrap:wrap;gap:6px}
.chips-h span{background:var(--tint);color:var(--accent);border-radius:6px;padding:2px 10px;font-family:var(--f-mono);font-size:.8rem}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 4px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.88rem;color:var(--ink)}
.chip span{color:var(--muted);font-family:var(--f-mono);font-size:.75rem;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] span{color:inherit;opacity:.85}
.sep{flex:0 0 1px;align-self:stretch;background:var(--line);margin-inline:4px}
.poolnote{font-size:.85rem;color:var(--muted);margin:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.82rem;color:var(--muted)}
.meta .qn{font-family:var(--f-mono);font-size:.78rem}
.meta .grow{flex:1}
.tag{background:var(--tint);color:var(--accent);border-radius:6px;padding:1px 8px;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.prompt{font-weight:600;font-size:clamp(1.08rem,3.4vw,1.28rem);line-height:1.4;margin:0;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.pos{flex:0 0 1.5rem;height:1.5rem;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.76rem;font-weight:500;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.opt.sel .pos{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{background:var(--good-bg);border-color:var(--good)}
.opt.correct .pos{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.missed{background:var(--good-bg);border:1.5px dashed var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .pos{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .grow{flex:1}
.fb{border-radius:10px;padding:12px 14px;font-weight:600;overflow-wrap:anywhere}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{color:var(--ink)}
.note{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:.92rem;overflow-wrap:anywhere}
.hint{font-size:.85rem;color:var(--muted);margin:0}

.flash{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:24px 20px;min-height:220px;display:grid;gap:12px;align-content:center;text-align:left;width:100%;min-width:0}
.flash .big{font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,4.6vw,1.55rem);line-height:1.3;overflow-wrap:anywhere;margin:0}
.flash ol{margin:0;padding-left:1.3rem;color:var(--muted)}
.flash ol li{overflow-wrap:anywhere}
.flash .lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flash .q{font-weight:600;overflow-wrap:anywhere;margin:0}
.flash.back{border-color:var(--accent);background:var(--tint)}
.status{font-size:.8rem;font-weight:700}
.status.k{color:var(--good)} .status.m{color:var(--bad)}

.score{font-family:var(--f-display);font-weight:700;font-size:clamp(2.4rem,10vw,3.4rem);line-height:1;margin:0}
.tb{display:grid;gap:10px}
.tb div{display:grid;grid-template-columns:minmax(0,12rem) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.tb .bar{height:8px}
.tb em{font-style:normal;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.miss{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.miss li{border-top:1px solid var(--line);padding-top:8px;font-size:.92rem;overflow-wrap:anywhere}
.miss li b{color:var(--good)}

.search{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
.key{display:grid;gap:0;margin:0;padding:0;list-style:none}
.key>li{display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--line)}
.key>li:first-child{border-top:0}
.key .qn{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.key .q{font-weight:600;overflow-wrap:anywhere}
.key ol{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:.93rem}
.key ol li{display:flex;gap:8px;padding:3px 8px;border-radius:6px;color:var(--muted)}
.key ol li i{font-style:normal;font-family:var(--f-mono);flex:0 0 1rem}
.key ol li span{min-width:0;overflow-wrap:anywhere}
.key ol li.right{background:var(--good-bg);color:var(--ink);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 0}

@media (prefers-reduced-motion:no-preference){
  .bar i{transition:width .25s ease}
  .opt,.chip,.tab{transition:border-color .12s,background .12s}
}
@media (max-width:480px){
  .card{padding:16px}
  .tb div{grid-template-columns:minmax(0,8rem) 1fr auto}
}
</style>
</head>

  var QS=[{"id":1,"set":"A","num":1,"topic":"soc","prompt":"What are two examples of personally identifiable information (PII)? (Choose two.)","options":["credit card number","language preference","street address","first name","IP address"],"answer":[1,3],"multi":true,"note":""},{"id":2,"set":"A","num":2,"topic":"soc","prompt":"Which organization is an international nonprofit organization that offers the CISSP certification?","options":["GIAC","IEEE","CompTIA","(ISC)2"],"answer":4,"multi":false,"note":""},{"id":3,"set":"A","num":3,"topic":"soc","prompt":"What is a benefit to an organization of using SOAR as part of the SIEM system?","options":["SOAR automates incident investigation and responds to workflows based on playbooks.","SOAR automation guarantees an uptime factor of “5 nines”.","SOAR was designed to address critical security events and high-end investigation.","SOAR would benefit smaller organizations because it requires no cybersecurity analyst involvement once installed."],"answer":1,"multi":false,"note":""},{"id":4,"set":"A","num":4,"topic":"soc","prompt":"Which personnel in a SOC are assigned the task of hunting for potential threats and implementing threat detection tools?","options":["Tier 3 SME","Tier 1 Analyst","SOC Manager","Tier 2 Incident Reporter"],"answer":1,"multi":false,"note":""},{"id":5,"set":"A","num":5,"topic":"soc","prompt":"The term cyber operations analyst refers to which group of personnel in a SOC?","options":["Tier 3 personnel","Tier 2 personnel","Tier 1 personnel","SOC managers"],"answer":3,"multi":false,"note":""},{"id":6,"set":"A","num":6,"topic":"soc","prompt":"How does a security information and event management system (SIEM) in a SOC help the personnel fight against security threats?","options":["by integrating all security devices and appliances in an organization","by analyzing logging data in real time","by dynamically implementing firewall rules","by combining data from multiple technologies"],"answer":4,"multi":false,"note":""},{"id":7,"set":"A","num":7,"topic":"soc","prompt":"An SOC is searching for a professional to fill a job opening. The employee must have expert-level skills in networking, endpoint, threat intelligence, and malware reverse engineering in order to search for cyber threats hidden within the network. Which job within an SOC requires a professional with those skills?","options":["Threat Hunter","SOC Manager","Incident Responder","Alert Analyst"],"answer":1,"multi":false,"note":""},{"id":8,"set":"A","num":8,"topic":"soc","prompt":"Which KPI metric does SOAR use to measure the time required to stop the spread of malware in the network?","options":["Time to Control","MITC","MITR","MTTD"],"answer":1,"multi":false,"note":""},{"id":9,"set":"A","num":9,"topic":"soc","prompt":"What job would require verification that an alert represents a true security incident or a false positive?","options":["Incident Reporter","Threat Hunter","SOC Manager","Alert Analyst"],"answer":4,"multi":false,"note":""},{"id":10,"set":"A","num":10,"topic":"attack","prompt":"When a user turns on the PC on Wednesday, the PC displays a message indicating that all of the user files have been locked. In order to get the files unencrypted, the user is supposed to send an email and include a specific ID in the email title. The message also includes ways to buy and submit bitcoins as payment for the file decryption. After inspecting the message, the technician suspects a security breach occurred. What type of malware could be responsible?","options":["spyware","adware","ransomware","Trojan"],"answer":3,"multi":false,"note":""},{"id":11,"set":"A","num":11,"topic":"attack","prompt":"An employee connects wirelessly to the company network using a cell phone. The employee then configures the cell phone to act as a wireless access point that will allow new employees to connect to the company network. Which type of security threat best describes this situation?","options":["spoofing","rogue access point","denial of service","cracking"],"answer":2,"multi":false,"note":""},{"id":12,"set":"A","num":12,"topic":"attack","prompt":"A company has just had a cybersecurity incident. The threat actor appeared to have a goal of network disruption and appeared to use a common security hack tool that overwhelmed a particular server with a large amount of traffic. This traffic rendered the server inoperable. How would a certified cybersecurity analyst classify this type of threat actor?","options":["state-sponsored","terrorist","amateur","hacktivist"],"answer":3,"multi":false,"note":""},{"id":13,"set":"A","num":13,"topic":"attack","prompt":"A user calls the help desk complaining that the password to access the wireless network has changed without warning. The user is allowed to change the password, but an hour later, the same thing occurs. What might be happening in this situation?","options":["user laptop","weak password","password policy","rogue access point","user error"],"answer":4,"multi":false,"note":""},{"id":14,"set":"A","num":14,"topic":"soc","prompt":"Which regulatory law regulates the identification, storage, and transmission of patient personal healthcare information?","options":["GLBA","HIPAA","FISMA","PCI-DSS"],"answer":2,"multi":false,"note":""},{"id":15,"set":"A","num":15,"topic":"attack","prompt":"What type of cyberwarfare weapon was Stuxnet?","options":["virus","worm","ransomware","botnet"],"answer":2,"multi":false,"note":""},{"id":16,"set":"A","num":16,"topic":"attack","prompt":"What websites should a user avoid when connecting to a free and open wireless hotspot?","options":["websites to check account fees","websites to make purchases","websites to check stock prices","websites to check product details"],"answer":2,"multi":false,"note":""},{"id":17,"set":"A","num":17,"topic":"attack","prompt":"In a smart home, an owner has connected many home devices to the Internet, such as the refrigerator and the coffee maker. The owner is concerned that these devices will make the wireless network vulnerable to attacks. What action could be taken to address this issue?","options":["Configure mixed mode wireless operation.","Disable the SSID broadcast.","Assign static IP addresses to the wireless devices.","Install the latest firmware versions for the devices."],"answer":4,"multi":false,"note":""},{"id":18,"set":"A","num":18,"topic":"attack","prompt":"Which statement describes cyberwarfare?","options":["It is simulation software for Air Force pilots that allows them to practice under a simulated war scenario.","It is Internet-based conflict that involves the penetration of information systems of other nations.","It is a series of personal protective equipment developed for soldiers involved in nuclear war","Cyberwarfare is an attack carried out by a group of script kiddies."],"answer":2,"multi":false,"note":""},{"id":19,"set":"A","num":19,"topic":"attack","prompt":"Why do IoT devices pose a greater risk than other computing devices on a network?","options":["IoT devices cannot function on an isolated network with only an Internet connection.","Most IoT devices do not receive frequent firmware updates.","Most IoT devices do not require an Internet connection and are unable to receive new updates.","IoT devices require unencrypted wireless connections."],"answer":2,"multi":false,"note":""},{"id":20,"set":"A","num":20,"topic":"attack","prompt":"Which cyber attack involves a coordinated attack from a botnet of zombie computers?","options":["ICMP redirect","DDoS","address spoofing","MITM"],"answer":2,"multi":false,"note":""},{"id":21,"set":"A","num":21,"topic":"attack","prompt":"What is the dark web?","options":["It is a website that reports the most recent activities of cybercriminals all over the world.","It is part of the internet that can only be accessed with special software.","It is a website that sells stolen credit cards.","It is part of the internet where a person can obtain personally identifiable information from anyone for free"],"answer":2,"multi":false,"note":""},{"id":22,"set":"A","num":22,"topic":"soc","prompt":"Which three are major categories of elements in a security operations center? (Choose three.)","options":["Internet connection","people","processes","database engine","data center","technologies"],"answer":[2,3,6],"multi":true,"note":""},{"id":23,"set":"A","num":23,"topic":"soc","prompt":"A worker in the records department of a hospital accidentally sends a medical record of a patient to a printer in another department. When the worker arrives at the printer, the patient record printout is missing. What breach of confidentiality does this situation describe?","options":["PHI","PII","EMR","PSI"],"answer":1,"multi":false,"note":""},{"id":24,"set":"A","num":24,"topic":"attack","prompt":"A group of users on the same network are all complaining about their computers running slowly. After investigating, the technician determines that these computers are part of a zombie network. Which type of malware is used to control these computers?","options":["rootkit","botnet","spyware","virus"],"answer":2,"multi":false,"note":""},{"id":25,"set":"A","num":25,"topic":"attack","prompt":"What is the main purpose of cyberwarfare?","options":["to gain advantage over adversaries","to simulate possible war scenarios among nations","to develop advanced network devices","to protect cloud-based data centers"],"answer":1,"multi":false,"note":""},{"id":26,"set":"A","num":26,"topic":"soc","prompt":"Which three technologies should be included in a SOC security information and event management system? (Choose three.)","options":["log management","firewall appliance","threat intelligence","proxy service","security monitoring","intrusion prevention"],"answer":[1,3,5],"multi":true,"note":""},{"id":27,"set":"A","num":27,"topic":"os","prompt":"Why would a network administrator choose Linux as an operating system in the Security Operations Center (SOC)?","options":["The administrator has more control over the operating system.","It is easier to use than other operating systems.","It is more secure than other server operating systems.","More network applications are created for this environment."],"answer":1,"multi":false,"note":""},{"id":28,"set":"A","num":28,"topic":"os","prompt":"Which two methods can be used to harden a computing device? (Choose two.)","options":["Update patches on a strict annual basis irrespective of release date.","Ensure physical security.","Allow default services to remain enabled.","Allow USB auto-detection.","Enforce the password history mechanism."],"answer":[2,5],"multi":true,"note":""},{"id":29,"set":"A","num":29,"topic":"os","prompt":"Which Linux command can be used to display the name of the current working directory?","options":["sudo","pwd","chmod","ps"],"answer":2,"multi":false,"note":""},{"id":30,"set":"A","num":30,"topic":"os","prompt":"A Linux system boots into the GUI by default, so which application can a network administrator use in order to access the CLI environment?","options":["system viewer","package management tool","file viewer","terminal emulator"],"answer":4,"multi":false,"note":""},{"id":31,"set":"A","num":31,"topic":"os","prompt":"Which user can override file permissions on a Linux computer?","options":["any user that has ‘other’ permission to the file","only the creator of the file","root user","any user that has ‘group’ permission to the file"],"answer":3,"multi":false,"note":""},{"id":32,"set":"A","num":32,"topic":"os","prompt":"Which type of tool allows administrators to observe and understand every detail of a network transaction?","options":["packet capture software","malware analysis tool","ticketing system","log manager"],"answer":1,"multi":false,"note":""},{"id":33,"set":"A","num":33,"topic":"os","prompt":"Why is Kali Linux a popular choice in testing the network security of an organization?","options":["It is an open source Linux security distribution containing many penetration tools.","It can be used to intercept and log network traffic.","It can be used to test weaknesses by using only malicious software.","It is a network scanning tool that prioritizes security risks."],"answer":1,"multi":false,"note":""},{"id":34,"set":"A","num":34,"topic":"os","prompt":"What are two advantages of the NTFS file system compared with FAT32? (Choose two.)","options":["NTFS is easier to configure.","NTFS allows faster formatting of drives.","NTFS provides more security features.","NTFS allows faster access to external peripherals such as a USB drive.","NTFS supports larger files.","NTFS allows the automatic detection of bad sectors."],"answer":[3,5],"multi":true,"note":""},{"id":35,"set":"A","num":35,"topic":"os","prompt":"A PC user issues the netstat command without any options. What is displayed as the result of this command?","options":["a network connection and usage report","a local routing table","a list of all established active TCP connections","a historical list of successful pings that have been sent"],"answer":3,"multi":false,"note":""},{"id":36,"set":"A","num":36,"topic":"os","prompt":"Which statement describes the function of the Server Message Block (SMB) protocol?","options":["It is used to manage remote PCs.","It is used to share network resources.","It is used to compress files stored on a disk.","It is used to stream media contents."],"answer":2,"multi":false,"note":""},{"id":37,"set":"A","num":37,"topic":"os","prompt":"A user creates a file with .ps1 extension in Windows. What type of file is it?","options":["PowerShell function","PowerShell script","PowerShell documentation","PowerShell cmdlet"],"answer":2,"multi":false,"note":""},{"id":38,"set":"A","num":38,"topic":"os","prompt":"A user logs in to Windows with a regular user account and attempts to use an application that requires administrative privileges. What can the user do to successfully use the application?","options":["Right-click the application and choose Run as root .","Right-click the application and choose Run as P g frames to the attacker instead of to the legitimate host"],"answer":4,"multi":false,"note":""},{"id":1126,"set":"B","num":126,"topic":"attack","prompt":"In what type of attack is a cybercriminal attempting to prevent legitimate users from accessing network services?","options":["MITM","address spoofing","session hijacking","DoS"],"answer":4,"multi":false,"note":""}];
  var TOPICS=[['soc','SOC, careers & compliance'],['attack','Attacks, malware & threat actors'],['os','Linux & Windows'],['net','Network protocols & addressing'],['swr','Switching, routing & wireless'],['def','Security tools & monitoring']];
  var TN={};TOPICS.forEach(function(t){TN[t[0]]=t[1]});
  var SETS=[['A','FA1 & FA2'],['B','FA3, FA4 & FA5']];
  var SN={A:'FA1 & FA2',B:'FA3–FA5'};
  function label(q){return SN[q.set]+' · Q'+q.num}

  var KEY='infosec-reviewer-v1';
  var store={missed:{},known:{}};
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);store.missed=p.missed||{};store.known=p.known||{}}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

  var S={mode:'quiz',topics:{},sets:{},missedOnly:false,shuffle:true,quiz:null,fc:null,search:''};
  var $=function(s){return document.querySelector(s)};
  var view=$('#view');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function cnt(o){return Object.keys(o).length}
  function pool(){
    return QS.filter(function(q){
      return (cnt(S.topics)===0||S.topics[q.topic])&&(cnt(S.sets)===0||S.sets[q.set])&&(!S.missedOnly||store.missed[q.id]);
    });
  }
  function isCorrect(q,pick){
    if(q.multi){return q.answer.slice().sort().join()===(pick||[]).slice().sort().join()}
    return pick===q.answer;
  }
  function ansText(q){
    if(q.multi)return q.answer.map(function(n){return '#'+n+' '+q.options[n-1]}).join(' · ');
    return '#'+q.answer+' '+q.options[q.answer-1];
  }
  function record(id,ok){
    if(ok){delete store.missed[id];store.known[id]=1}else{store.missed[id]=1;delete store.known[id]}
    save();renderFilters();
  }

  function renderFilters(){
    var miss=Object.keys(store.missed).length;
    var h='';
    SETS.forEach(function(s){
      var c=QS.filter(function(q){return q.set===s[0]}).length;
      h+='<button class="chip" data-a="set" data-v="'+s[0]+'" aria-pressed="'+(!!S.sets[s[0]])+'">'+esc(s[1])+' <span>'+c+'</span></button>';
    });
    h+='<span class="sep"></span>';
    TOPICS.forEach(function(t){
      var c=QS.filter(function(q){return q.topic===t[0]}).length;
      h+='<button class="chip" data-a="topic" data-v="'+t[0]+'" aria-pressed="'+(!!S.topics[t[0]])+'">'+esc(t[1])+' <span>'+c+'</span></button>';
    });
    h+='<span class="sep"></span>';
    h+='<button class="chip" data-a="missed" aria-pressed="'+S.missedOnly+'">Missed only <span>'+miss+'</span></button>';
    h+='<button class="chip" data-a="shuffle" aria-pressed="'+S.shuffle+'">Shuffle</button>';
    $('#filters').innerHTML=h;
    $('#poolnote').textContent=pool().length+' of '+QS.length+' questions selected. Nothing selected in a row means all of it.';
  }
  function resetSessions(){S.quiz=null;S.fc=null;renderFilters();renderView()}
  function renderTabs(){
    document.querySelectorAll('#tabs .tab').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.v===S.mode))});
  }
  function emptyCard(){
    return '<div class="card"><p class="empty">Nothing to show with these filters. '+(S.missedOnly?'You have no missed questions in this selection yet.':'Try clearing a filter.')+'</p></div>';
  }

  /* ---------- Quiz ---------- */
  function ensureQuiz(){
    if(!S.quiz){var l=pool();S.quiz={list:S.shuffle?shuf(l):l,i:0,res:{},cur:null,sel:[]}}
  }
  function renderQuiz(){
    if(!pool().length){view.innerHTML=emptyCard();return}
    ensureQuiz();
    var z=S.quiz,n=z.list.length;
    if(z.i>=n){renderSummary();return}
    var q=z.list[z.i],a=z.cur;
    var done=Object.keys(z.res).filter(function(k){return z.res[k]}).length;
    var h='<div class="card">';
    h+='<div class="bar" aria-hidden="true"><i style="width:'+Math.round(z.i/n*100)+'%"></i></div>';
    h+='<div class="meta"><span>Question '+(z.i+1)+' of '+n+'</span><span class="tag">'+esc(TN[q.topic])+'</span><span class="qn">'+esc(label(q))+'</span><span class="grow"></span><span>'+done+' correct</span></div>';
    h+='<p class="prompt">'+esc(q.prompt)+'</p>';
    h+='<div class="opts">';
    q.options.forEach(function(o,i){
      var num=i+1,c='opt';
      if(!a){
        if(q.multi&&z.sel.indexOf(num)>-1)c+=' sel';
      }else if(q.multi){
        var inA=q.answer.indexOf(num)>-1,s=a.pick.indexOf(num)>-1;
        if(inA&&s)c+=' correct';else if(inA)c+=' missed';else if(s)c+=' wrong';else c+=' dim';
      }else{
        if(num===q.answer)c+=' correct';else if(num===a.pick)c+=' wrong';else c+=' dim';
      }
      h+='<button class="'+c+'" data-a="'+(q.multi?'tog':'opt')+'" data-v="'+num+'"'+(a?' disabled':'')+(q.multi&&!a?' aria-pressed="'+(z.sel.indexOf(num)>-1)+'"':'')+'><b class="pos">'+num+'</b><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
    if(!a&&q.multi){
      h+='<div class="row"><button class="btn" data-a="check"'+(z.sel.length?'':' disabled')+'>Check answer</button><span class="hint">Select '+q.answer.length+' options, then check.</span></div>';
    }
    if(a){
      if(a.correct)h+='<div class="fb ok" role="status">Correct.</div>';
      else h+='<div class="fb no" role="status">Not quite. Correct answer: <b>'+esc(ansText(q))+'</b></div>';
      if(q.note)h+='<div class="note">'+esc(q.note)+'</div>';
      h+='<div class="row"><span class="grow"></span><button class="btn" data-a="next">'+(z.i+1>=n?'See results':'Next')+'</button></div>';
    }
    h+='</div>';
    view.innerHTML=h;
    if(a){var nb=view.querySelector('[data-a="next"]');if(nb)nb.focus()}
  }
  function renderSummary(){
    var z=S.quiz,n=z.list.length;
    var right=z.list.filter(function(q){return z.res[q.id]}).length;
    var pct=Math.round(right/n*100);
    var missed=z.list.filter(function(q){return !z.res[q.id]});
    var h='<div class="card"><div class="meta"><span>Round complete</span></div>';
    h+='<p class="score">'+right+' / '+n+' <span style="font-size:.4em;color:var(--muted);font-family:var(--f-body)">'+pct+'%</span></p>';
    h+='<div class="tb">';
    TOPICS.forEach(function(t){
      var qs=z.list.filter(function(q){return q.topic===t[0]});if(!qs.length)return;
      var r=qs.filter(function(q){return z.res[q.id]}).length;
      h+='<div><span>'+esc(t[1])+'</span><span class="bar"><i style="width:'+Math.round(r/qs.length*100)+'%"></i></span><em>'+r+'/'+qs.length+'</em></div>';
    });
    h+='</div>';
    if(missed.length){
      h+='<p class="hint">To review ('+missed.length+')</p><ul class="miss">';
      missed.forEach(function(q){h+='<li>'+esc(label(q))+'. '+esc(q.prompt)+'<br><b>'+esc(ansText(q))+'</b></li>'});
      h+='</ul>';
    }
    h+='<div class="row">';
    if(missed.length)h+='<button class="btn" data-a="retry">Retry the '+missed.length+' missed</button>';
    h+='<button class="btn'+(missed.length?' ghost':'')+'" data-a="restart">New round</button></div></div>';
    view.innerHTML=h;
  }
  function finish(q,pick){
    var z=S.quiz;
    z.cur={pick:pick,correct:isCorrect(q,pick)};
    z.res[q.id]=z.cur.correct;record(q.id,z.cur.correct);renderQuiz();
  }
  function curQ(){var z=S.quiz;return z&&z.i<z.list.length?z.list[z.i]:null}

  /* ---------- Flashcards ---------- */
  function ensureFc(){
    if(!S.fc){var l=pool();S.fc={list:S.shuffle?shuf(l):l,i:0,flip:false,res:{}}}
  }
  function optList(q){return '<ol>'+q.options.map(function(o){return '<li>'+esc(o)+'</li>'}).join('')+'</ol>'}
  function renderCards(){
    if(!pool().length){view.innerHTML=emptyCard();return}
    ensureFc();
    var f=S.fc,n=f.list.length;
    if(f.i>=n){
      var k=Object.keys(f.res).filter(function(x){return f.res[x]}).length;
      view.innerHTML='<div class="card"><div class="meta"><span>Deck finished</span></div><p class="score">'+k+' / '+n+'</p><p class="hint">cards marked as known this round</p><div class="row"><button class="btn" data-a="fcrestart">Go again</button></div></div>';
      return;
    }
    var q=f.list[f.i];
    var st=store.known[q.id]?'<span class="status k">Marked known</span>':(store.missed[q.id]?'<span class="status m">Marked missed</span>':'');
    var h='<div class="card"><div class="bar" aria-hidden="true"><i style="width:'+Math.round(f.i/n*100)+'%"></i></div>';
    h+='<div class="meta"><span>Card '+(f.i+1)+' of '+n+'</span><span class="tag">'+esc(TN[q.topic])+'</span><span class="qn">'+esc(label(q))+'</span><span class="grow"></span>'+st+'</div>';
    if(!f.flip){
      h+='<button class="flash" data-a="flip" aria-label="Show answer"><span class="lbl">Question</span><p class="big">'+esc(q.prompt)+'</p>'+optList(q)+'<span class="hint">Tap to show the answer</span></button>';
    }else{
      var body;
      if(q.multi){body='<ol style="color:var(--ink);font-weight:600;font-size:1.05rem">'+q.answer.map(function(n2){return '<li value="'+n2+'">'+esc(q.options[n2-1])+'</li>'}).join('')+'</ol>'}
      else{body='<p class="big">#'+q.answer+' '+esc(q.options[q.answer-1])+'</p>'}
      h+='<button class="flash back" data-a="flip" aria-label="Show question"><span class="lbl">Answer</span>'+body+(q.note?'<span class="hint">'+esc(q.note)+'</span>':'')+'<span class="hint">'+esc(q.prompt)+'</span></button>';
    }
    h+='<div class="row"><button class="btn ghost" data-a="prev"'+(f.i===0?' disabled':'')+'>Back</button><span class="grow"></span><button class="btn ghost" data-a="fcmiss">Missed it</button><button class="btn" data-a="fcknown">Got it</button></div>';
    h+='<p class="hint">Keyboard: space flips, arrow keys move.</p></div>';
    view.innerHTML=h;
  }

  /* ---------- Answer key ---------- */
  function keyList(){
    var s=S.search.trim().toLowerCase();
    var l=pool().filter(function(q){
      if(!s)return true;
      return (q.prompt+' '+q.options.join(' ')+' '+label(q)).toLowerCase().indexOf(s)>-1;
    });
    if(!l.length)return '<p class="empty">No matches.</p>';
    return '<ul class="key">'+l.map(function(q){
      var opts=q.options.map(function(o,i){
        var right=q.multi?q.answer.indexOf(i+1)>-1:q.answer===i+1;
        return '<li class="'+(right?'right':'')+'"><i>'+(i+1)+'</i><span>'+esc(o)+'</span></li>';
      }).join('');
      return '<li><span class="qn">'+esc(label(q))+' · answer '+esc(q.multi?q.answer.join(', '):String(q.answer))+'</span><span class="q">'+esc(q.prompt)+'</span><ol>'+opts+'</ol>'+(q.note?'<div class="note">'+esc(q.note)+'</div>':'')+'</li>';
    }).join('')+'</ul>';
  }
  function renderKey(){
    view.innerHTML='<div class="card"><input id="search" class="search" type="search" placeholder="Search questions or answers" aria-label="Search" value="'+esc(S.search)+'"><p class="hint">Option numbers match the order shown in your Canvas results. Highlighted rows are the correct answers.</p><div id="keylist">'+keyList()+'</div></div>';
  }

  function renderView(){
    renderTabs();
    if(S.mode==='quiz')renderQuiz();else if(S.mode==='cards')renderCards();else renderKey();
  }

  /* ---------- Events ---------- */
  function fcAdvance(ok){
    var f=S.fc,q=f.list[f.i];f.res[q.id]=ok;record(q.id,ok);f.i++;f.flip=false;renderCards();
  }
  function toggle(o,k){if(o[k])delete o[k];else o[k]=1}
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b)return;
    var a=b.dataset.a,v=b.dataset.v;
    if(a==='mode'){S.mode=v;renderView()}
    else if(a==='set'){toggle(S.sets,v);resetSessions()}
    else if(a==='topic'){toggle(S.topics,v);resetSessions()}
    else if(a==='missed'){S.missedOnly=!S.missedOnly;resetSessions()}
    else if(a==='shuffle'){S.shuffle=!S.shuffle;resetSessions()}
    else if(a==='opt'){var q=curQ();if(q&&!S.quiz.cur)finish(q,+v)}
    else if(a==='tog'){
      var z=S.quiz;if(!z||z.cur)return;var n=+v,ix=z.sel.indexOf(n);
      if(ix>-1)z.sel.splice(ix,1);else z.sel.push(n);renderQuiz();
    }
    else if(a==='check'){var q2=curQ();if(q2&&!S.quiz.cur&&S.quiz.sel.length)finish(q2,S.quiz.sel.slice())}
    else if(a==='next'){S.quiz.i++;S.quiz.cur=null;S.quiz.sel=[];renderQuiz()}
    else if(a==='retry'){var z2=S.quiz;var m=z2.list.filter(function(q3){return !z2.res[q3.id]});S.quiz={list:shuf(m),i:0,res:{},cur:null,sel:[]};renderQuiz()}
    else if(a==='restart'){S.quiz=null;renderQuiz()}
    else if(a==='flip'){S.fc.flip=!S.fc.flip;renderCards()}
    else if(a==='prev'){if(S.fc.i>0){S.fc.i--;S.fc.flip=false;renderCards()}}
    else if(a==='fcknown')fcAdvance(true);
    else if(a==='fcmiss')fcAdvance(false);
    else if(a==='fcrestart'){S.fc=null;renderCards()}
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='search'){S.search=e.target.value;$('#keylist').innerHTML=keyList()}
  });
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(t&&t.tagName==='INPUT')return;
    if(S.mode==='quiz'){
      var q=curQ();
      if(q&&!S.quiz.cur&&/^[1-9]$/.test(e.key)){
        var num=+e.key;
        if(num<=q.options.length){
          if(q.multi){var ix=S.quiz.sel.indexOf(num);if(ix>-1)S.quiz.sel.splice(ix,1);else S.quiz.sel.push(num);renderQuiz()}
          else finish(q,num);
        }
      }
    }
    if(S.mode==='cards'&&S.fc&&S.fc.i<S.fc.list.length){
      if(e.key===' '&&!(t&&t.tagName==='BUTTON'&&t.dataset.a!=='flip')){e.preventDefault();S.fc.flip=!S.fc.flip;renderCards()}
      else if(e.key==='ArrowRight'){S.fc.i=Math.min(S.fc.i+1,S.fc.list.length);S.fc.flip=false;renderCards()}
      else if(e.key==='ArrowLeft'&&S.fc.i>0){S.fc.i--;S.fc.flip=false;renderCards()}
    }
  });

  renderFilters();
  renderView();
})();
</script>
</body>
</html>
