<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>INFO SEC Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one centered column. Header with subject chips, three mode tabs, set and topic filters, then a single working card. */
:root{
  color-scheme:light;
  --bg:#ECF0F3; --surface:#FFFFFF; --ink:#111A22; --muted:#56646F; --line:#D1D9DF;
  --accent:#C2410C; --accent-ink:#FFFFFF; --tint:#FBE6DA;
  --good:#15803D; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE7E4;
  --f-display:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --surface:#171E26; --ink:#E8EDF2; --muted:#94A1AE; --line:#2A3541;
    --accent:#FF9A5C; --accent-ink:#1A0D04; --tint:#3A2315;
    --good:#4ADE80; --good-bg:#12331F; --bad:#F87171; --bad-bg:#3A1A18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#171E26; --ink:#E8EDF2; --muted:#94A1AE; --line:#2A3541;
  --accent:#FF9A5C; --accent-ink:#1A0D04; --tint:#3A2315;
  --good:#4ADE80; --good-bg:#12331F; --bad:#F87171; --bad-bg:#3A1A18;
  color-scheme:dark;
}
