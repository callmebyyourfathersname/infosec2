<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Systems Integration — FA1 &amp; FA2 Reviewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0B111C;
    --panel: #121A29;
    --panel-raised: #17202F;
    --line: #26314A;
    --line-soft: #1C2537;
    --text: #E7ECF6;
    --text-dim: #8C99B4;
    --text-faint: #5B6787;
    --up: #49D6A6;
    --up-dim: #1D4438;
    --down: #F17469;
    --down-dim: #4A2320;
    --pending: #F0B94D;
    --pending-dim: #453210;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(73,214,166,0.05), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(240,185,77,0.04), transparent 45%);
  }

  a{ color: inherit; }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------- Header / status bar ---------- */
  .statusbar{
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .statusbar h1{
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  .statusbar .sub{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
  }
  .uptime{
    display:flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--mono);
  }
  .uptime .num{
    font-size: 30px;
    font-weight: 700;
    color: var(--up);
    line-height:1;
  }
  .uptime.warn .num{ color: var(--pending); }
  .uptime.crit .num{ color: var(--down); }
  .uptime .label{
    font-size: 11px;
    color: var(--text-faint);
    text-transform: none;
  }

  /* ---------- Node grid ---------- */
  .nodegrid{
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 7px;
  }
  @media (max-width: 480px){
    .nodegrid{ grid-template-columns: repeat(6, 1fr); }
  }

  /* ---------- Map trigger + popup ---------- */
  .mapTriggerRow{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .mapTrigger{
    display:flex;
    align-items:center;
    gap: 10px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .mapTrigger:hover{ border-color: var(--text-faint); }
  .mapTrigger .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pending);
    flex: none;
  }
  .mapTrigger .mini{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  .modal-backdrop{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(5,8,14,0.72);
    backdrop-filter: blur(2px);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open{ display:flex; }
  @media (min-width: 640px){
    .modal-backdrop{ align-items: center; }
  }
  .modal-sheet{
    background: var(--panel);
    border: 1px solid var(--line);
    width: 100%;
    max-width: 560px;
    max-height: 82vh;
    border-radius: 16px 16px 0 0;
    padding: 18px 18px 22px;
    overflow-y: auto;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
  }
  @media (min-width: 640px){
    .modal-sheet{ border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-head h2{
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }
  .modal-close{
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 30px;
    height: 30px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  .modal-close:hover{ color: var(--text); border-color: var(--text-faint); }
  .modal-legend{
    display:flex;
    gap: 14px;
    margin-bottom: 14px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }
  .modal-legend span{ display:flex; align-items:center; gap:5px; }
  .modal-legend .sw{ width:8px; height:8px; border-radius:2px; }
  .node{
    aspect-ratio: 1;
    border-radius: 3px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-faint);
    transition: transform 0.1s ease;
    padding: 0;
  }
  .node:hover{ transform: translateY(-1px); border-color: var(--text-faint); }
  .node.current{ outline: 2px solid var(--pending); outline-offset: 1px; }
  .node.up{ background: var(--up-dim); border-color: var(--up); color: var(--up); }
  .node.down{ background: var(--down-dim); border-color: var(--down); color: var(--down); }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items:center;
  }
  .btn{
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .btn:hover{ border-color: var(--text-faint); color: var(--text); }
  .btn.active{ border-color: var(--pending); color: var(--pending); background: var(--pending-dim); }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; }
  .toolbar .spacer{ flex: 1; }
  .filtercount{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  /* ---------- Question card ---------- */
  .card{
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 12px;
    padding: 26px 26px 22px;
  }
  .card-head{
    display:flex;
    justify-content: space-between;
    align-items:flex-start;
    margin-bottom: 14px;
    gap: 12px;
  }
  .qmeta{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .qtype-pill{
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 10px;
    color: var(--text-dim);
  }
  .qtext{
    font-size: 18px;
    line-height: 1.5;
    font-weight: 500;
    margin: 4px 0 22px;
  }

  .options{
    display:flex;
    flex-direction: column;
    gap: 8px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    font-size: 14.5px;
    line-height: 1.45;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .option:hover{ border-color: var(--text-faint); }
  .option .box{
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid var(--line-soft);
    margin-top: 1px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }
  .option.tf .box{ border-radius: 50%; }
  .option.selected{ border-color: var(--pending); background: rgba(240,185,77,0.06); }
  .option.selected .box{ border-color: var(--pending); color: var(--pending); }

  .option.correct{ border-color: var(--up); background: rgba(73,214,166,0.08); }
  .option.correct .box{ border-color: var(--up); background: var(--up); color: #05231A; }
  .option.incorrect{ border-color: var(--down); background: rgba(241,116,105,0.08); }
  .option.incorrect .box{ border-color: var(--down); background: var(--down); color: #330A07; }
  .option.locked{ cursor: default; }
  .option.locked:hover{ border-color: inherit; }
  .option.dim{ opacity: 0.55; }

  .feedback{
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.55;
    display: none;
  }
  .feedback.show{ display:block; }
  .feedback.up{ background: var(--up-dim); border: 1px solid var(--up); color: #C9F5E6; }
  .feedback.down{ background: var(--down-dim); border: 1px solid var(--down); color: #FBD6D2; }
  .feedback .tag{
    font-family: var(--mono);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.04em;
    display:block;
    margin-bottom: 4px;
  }
  .feedback.up .tag{ color: var(--up); }
  .feedback.down .tag{ color: var(--down); }

  .card-foot{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 24px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .navbtn{
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    color: var(--text);
    cursor: pointer;
  }
  .navbtn:hover{ border-color: var(--text-faint); }
  .navbtn:disabled{ opacity: 0.35; cursor: not-allowed; }
  .navbtn.primary{ background: var(--pending-dim); border-color: var(--pending); color: var(--pending); }
  .navbtn.submit{ background: rgba(73,214,166,0.1); border-color: var(--up); color: var(--up); }

  .hint{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  /* ---------- Empty / done state ---------- */
  .done-card{
    text-align:center;
    padding: 50px 26px;
  }
  .done-card .bignum{
    font-family: var(--mono);
    font-size: 54px;
    font-weight: 700;
    color: var(--up);
    line-height:1;
  }
  .done-card.warn .bignum{ color: var(--pending); }
  .done-card.crit .bignum{ color: var(--down); }
  .done-card .sub{ color: var(--text-dim); margin-top: 10px; font-size: 14px; }
  .done-card .actions{ margin-top: 26px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  footer{
    text-align:center;
    margin-top: 30px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }

  ::selection{ background: var(--pending-dim); }
</style>
</head>
<body>
<div class="wrap">

  <div class="statusbar">
    <div>
      <h1>Systems Integration — FA1 &amp; FA2 Reviewer</h1>
      <div class="sub" id="statusSub">58 integration points monitored</div>
    </div>
    <div class="uptime" id="uptimeBox">
      <div>
        <div class="num" id="uptimeNum">—</div>
        <div class="label" id="uptimeLabel">no data yet</div>
      </div>
    </div>
  </div>

  <div class="mapTriggerRow">
    <button class="mapTrigger" id="mapTriggerBtn">
      <span class="dot" id="mapTriggerDot"></span>
      Question map
      <span class="mini" id="mapTriggerMini"></span>
    </button>
  </div>

  <div class="toolbar">
    <button class="btn" id="shuffleBtn" title="Shuffle question order">Shuffle</button>
    <button class="btn" id="orderBtn" title="Back to original order">Original order</button>
    <button class="btn" id="missedBtn" title="Show only questions you've gotten wrong so far">Review missed <span class="filtercount" id="missedCount"></span></button>
    <div class="spacer"></div>
    <button class="btn" id="resetBtn" title="Clear saved progress">Reset progress</button>
  </div>

  <div id="cardHost"></div>

  <footer>local progress only · nothing leaves this browser</footer>
</div>

<div class="modal-backdrop" id="mapBackdrop">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>Jump to a question</h2>
      <button class="modal-close" id="mapCloseBtn">&times;</button>
    </div>
    <div class="modal-legend">
      <span><span class="sw" style="background:var(--up)"></span>correct</span>
      <span><span class="sw" style="background:var(--down)"></span>incorrect</span>
      <span><span class="sw" style="background:var(--panel-raised);border:1px solid var(--line)"></span>unanswered</span>
    </div>
    <div class="nodegrid" id="nodegrid"></div>
  </div>
</div>

<script>
const QUESTIONS = [{"id":1,"type":"single","q":"McCall's quality model groups quality factors under three perspectives. Which are they?","options":["Product operation, product revision, product transition","Cost, schedule, scope","Design, build, deploy","Functional, non-functional, domain"],"correct":[0]},{"id":2,"type":"single","q":"The waterfall model can still work in an integration setting when:","options":["Interfaces are fixed by contract before work begins","The partner changes the API frequently","No specification exists","The team is co-located"],"correct":[0]},{"id":3,"type":"single","q":"Two systems use a field named \"status\" to mean different things. This is an example of:","options":["A performance defect","A licensing problem","A version control conflict","Assumed data semantics"],"correct":[3]},{"id":4,"type":"tf","q":"Every principle from IT0023 still applies in IT0129.","options":["True","False"],"correct":[0]},{"id":5,"type":"single","q":"An integration project depends on a partner whose release dates are outside your control. Which process model risk is highest?","options":["Incremental, because increments are small","Reuse-oriented, because components exist","Waterfall, because documentation is produced","Agile, because a sprint may depend on a release you cannot schedule"],"correct":[3]},{"id":6,"type":"single","q":"Which software engineering layer is most affected by adding organizational boundaries?","options":["Tools, which become unnecessary","Process, which must now coordinate across parties","Methods, which no longer apply","Quality focus, which is abandoned"],"correct":[1]},{"id":7,"type":"single","q":"Which factors belong to McCall's product revision group?","options":["Usability, integrity, correctness","Correctness, reliability, efficiency","Maintainability, flexibility, testability","Portability, reusability, interoperability"],"correct":[2]},{"id":8,"type":"single","q":"In an integrated system, your effective quality attributes are best described as:","options":["The best of your components","Independent of your dependencies","The average of your components","Bounded by the weakest of your dependencies"],"correct":[3]},{"id":9,"type":"single","q":"Why does psychological safety matter particularly in integration work?","options":["It reduces the need for testing","It determines whether a problem is raised early rather than after the interface is published and consumed","It shortens the critical path","It replaces the need for contracts"],"correct":[1]},{"id":10,"type":"single","q":"Why is McCall's product transition group the most relevant to this course?","options":["Because portability, reusability, and interoperability decide whether integration succeeds","Because it is the easiest to measure","Because the other groups apply only to hardware","Because it is the largest group"],"correct":[0]},{"id":11,"type":"single","q":"What does the availability chaining calculation demonstrate?","options":["That availability improves with more services","That end-to-end availability is the product of dependencies, so it falls as the chain lengthens","That availability is unrelated to the number of dependencies","That redundancy is unnecessary"],"correct":[1]},{"id":12,"type":"single","q":"Which factors belong to McCall's product operation group?","options":["Correctness, reliability, efficiency, integrity, usability","Maintainability, flexibility, testability","Portability, reusability, interoperability","Cost, schedule, risk"],"correct":[0]},{"id":13,"type":"single","q":"In a standalone system, interoperability is optional. In an integrated system it is:","options":["The point of the exercise","Handled entirely by the network layer","Still optional","A concern only for embedded systems"],"correct":[0]},{"id":14,"type":"single","q":"Nobody documented what should happen when a partner call times out. This is an example of:","options":["Organizational distance","Semantic drift","Availability mismatch","Unspecified failure behaviour"],"correct":[3]},{"id":15,"type":"tf","q":"Chaining more dependencies at fixed availability improves end-to-end availability.","options":["True","False"],"correct":[1]},{"id":16,"type":"single","q":"A partner changes their interface and consumers discover it in production. This is:","options":["A testing failure only","A licensing violation","Versioning neglect","A capacity planning failure"],"correct":[2]},{"id":17,"type":"single","q":"Which statement is true of an integrated system but not a standalone one?","options":["Its availability window is constrained by parties outside your control","It benefits from a documented process","It needs testing before release","It requires a quality focus"],"correct":[0]},{"id":18,"type":"single","q":"Which McCall perspective contains interoperability?","options":["Product transition","None; interoperability is not a McCall factor","Product revision","Product operation"],"correct":[0]},{"id":19,"type":"multi","q":"Which of the following change when a system must integrate rather than stand alone? (select all that apply)","options":["You inherit a data model you did not design","The need for a quality focus disappears","A published interface becomes a commitment","You must handle the partner's error behaviour","Their availability window constrains yours"],"correct":[0,2,3,4]},{"id":20,"type":"single","q":"A partner's maintenance window falls during your peak hour. This is:","options":["An availability mismatch, an integration constraint rather than a coding problem","A security incident","A scalability failure","A defect in their software"],"correct":[0]},{"id":21,"type":"single","q":"Your system reads directly from a partner's database rather than through their published API. This is:","options":["An example of loose coupling","Tight coupling to an internal model, which will break when they change their schema","Required by service-oriented architecture","Good practice, as it reduces latency"],"correct":[1]},{"id":22,"type":"tf","q":"Interoperability belongs to McCall's product transition group.","options":["True","False"],"correct":[0]},{"id":23,"type":"single","q":"Which observation best characterises the common integration challenges?","options":["Most are caused by insufficient hardware","Most are defects in compiler output","Most are resolved by adding developers","Most are semantic and organizational rather than technical"],"correct":[3]},{"id":24,"type":"single","q":"Integration projects most often fail on:","options":["Coding velocity","Number of developers assigned","Dependency on things the team does not control","Choice of programming language"],"correct":[2]},{"id":25,"type":"single","q":"In a standalone system you choose the data model. In an integrated system you:","options":["Store data only in memory","Must always adopt the partner's model wholesale","Have no data model at all","Must map to and from external models you did not design"],"correct":[3]},{"id":26,"type":"single","q":"IT0129 differs from IT0023 principally because you must now engineer a system that:","options":["Has no requirements specification","Uses a different programming paradigm","Must work correctly together with systems you did not build and cannot change","Runs only on cloud infrastructure"],"correct":[2]},{"id":27,"type":"single","q":"Four services are chained, each with 99% availability. The approximate end-to-end availability is:","options":["99%","About 96%","99.9%","About 99.99%"],"correct":[1]},{"id":28,"type":"single","q":"Which is the most consequential defect to leave in an integration model?","options":["An inconsistent font in the diagram","An unnumbered use case","A misaligned actor symbol","A missing failure path on a revenue-carrying exchange"],"correct":[3]},{"id":29,"type":"single","q":"Which is NOT one of the seven elements of a complete integration point specification?","options":["The vendor's commercial pricing model","Retry policy and idempotency","Versioning strategy","Data format and field semantics"],"correct":[0]},{"id":30,"type":"tf","q":"Sequence diagrams are useful for exposing retry and idempotency requirements.","options":["True","False"],"correct":[0]},{"id":31,"type":"single","q":"Why does modelling a system as a human actor cause problems?","options":["It makes the diagram harder to read","It hides that a machine is calling, with machine retry and volume behaviour","It prevents code generation","It violates the UML specification"],"correct":[1]},{"id":32,"type":"single","q":"What must accompany a corrected AI-generated model in the [AI-INTEGRATED] submission?","options":["Only the corrected diagrams","A screenshot of the prompt only","The original AI artifact, a marked error list, the corrected version, and a written defence","A signed statement that AI was not used"],"correct":[2]},{"id":33,"type":"tf","q":"Specifying the data type of a field is sufficient; semantics can be inferred.","options":["True","False"],"correct":[1]},{"id":34,"type":"single","q":"A standalone architecture asks what structure is best for the system. An integrated architecture asks:","options":["Which language the team prefers","Which vendor offers the lowest price","What structure is best given what the system must talk to","How many developers are available"],"correct":[2]},{"id":35,"type":"single","q":"A compensating action is required because:","options":["Logs must be written","Networks are slow","A distributed process that fails partway cannot be rolled back atomically","Partners charge per transaction"],"correct":[2]},{"id":36,"type":"single","q":"Two systems are each internally correct but together produce a wrong result. The most likely cause is:","options":["A hardware fault","An incompletely specified contract between them","An operating system incompatibility","A defect in one system's code"],"correct":[1]},{"id":37,"type":"single","q":"An integration point register records interface, format, synchronicity, error handling, and:","options":["The test coverage percentage","The developer's name and contact details","The estimated lines of code","The availability expectation placed on the external system"],"correct":[3]},{"id":38,"type":"tf","q":"A distributed process that fails halfway can be rolled back atomically like a database transaction.","options":["True","False"],"correct":[1]},{"id":39,"type":"single","q":"Which diagram most directly exposes timeout, retry, and idempotency requirements?","options":["Sequence diagram","Deployment diagram","Class diagram","Context diagram"],"correct":[0]},{"id":40,"type":"single","q":"An asynchronous boundary is appropriate when:","options":["The work is slow, bulk, or the partner is unreliable","The caller needs an immediate answer","The two systems share a database","Debugging simplicity is the priority"],"correct":[0]},{"id":41,"type":"single","q":"Which constraint on an integrated architecture is typically NOT negotiable?","options":["Your own module decomposition","Your choice of test framework","Your internal naming conventions","The partner's authentication scheme and availability window"],"correct":[3]},{"id":42,"type":"single","q":"What does an asynchronous design require that a synchronous one does not?","options":["Correlation of replies, ordering, and duplicate handling","Fewer integration tests","A larger database","A faster network"],"correct":[0]},{"id":43,"type":"tf","q":"In an integrated system, each integration point is a separate trust boundary.","options":["True","False"],"correct":[0]},{"id":44,"type":"single","q":"Placing an availability expectation on an external system is only meaningful if:","options":["It is expressed as a percentage","It has been agreed with the party that owns that system","It exceeds your own availability target","It is documented in your own wiki"],"correct":[1]},{"id":45,"type":"single","q":"Under the course AI-use matrix, for the Technical 1 ideation exercise the AI may:","options":["Produce gateways, and CI/CD pipelines"],"correct":[3]}];

const STORAGE_KEY = 'sysinteg-fa-reviewer-v1';

let state = loadState();
let order = state.order && state.order.length === QUESTIONS.length ? state.order : QUESTIONS.map((_,i)=>i);
let pos = 0;                 // index into `order`
let viewList = order;        // the list of indices currently being paged through (may be filtered)
let currentSelection = [];   // user's current picks (indices into options) for the active question, before lock
let locked = false;          // whether current question has been answered
let renderedQid = null;      // which question currentSelection currently belongs to

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { results:{}, order:null };
    const parsed = JSON.parse(raw);
    return { results: parsed.results || {}, order: parsed.order || null };
  }catch(e){ return { results:{}, order:null }; }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ results: state.results, order }));
}

function byId(qid){ return QUESTIONS.find(q => q.id === qid); }

function computeStats(){
  const answered = Object.keys(state.results).length;
  const correct = Object.values(state.results).filter(r => r.correct).length;
  const incorrect = answered - correct;
  const pct = answered ? Math.round((correct/answered)*1000)/10 : null;
  return { answered, correct, incorrect, pct, total: QUESTIONS.length };
}

function renderStatusBar(){
  const s = computeStats();
  const sub = document.getElementById('statusSub');
  const numEl = document.getElementById('uptimeNum');
  const labelEl = document.getElementById('uptimeLabel');
  const box = document.getElementById('uptimeBox');
  sub.textContent = `${s.answered}/${s.total} integration points checked`;
  if(s.pct === null){
    numEl.textContent = '—';
    labelEl.textContent = 'no data yet';
    box.className = 'uptime';
  } else {
    numEl.textContent = s.pct + '%';
    labelEl.textContent = `${s.correct} up · ${s.incorrect} down`;
    box.className = 'uptime' + (s.pct >= 80 ? '' : s.pct >= 50 ? ' warn' : ' crit');
  }
  const missedCount = Object.values(state.results).filter(r => !r.correct).length;
  document.getElementById('missedCount').textContent = missedCount ? `(${missedCount})` : '';

  // trigger button summary
  const dot = document.getElementById('mapTriggerDot');
  const mini = document.getElementById('mapTriggerMini');
  mini.textContent = `${s.answered}/${s.total}`;
  dot.style.background = s.pct === null ? 'var(--pending)' : (s.pct >= 80 ? 'var(--up)' : s.pct >= 50 ? 'var(--pending)' : 'var(--down)');
}

function openMap(){
  document.getElementById('mapBackdrop').classList.add('open');
}
function closeMap(){
  document.getElementById('mapBackdrop').classList.remove('open');
}

function renderNodeGrid(){
  const grid = document.getElementById('nodegrid');
  grid.innerHTML = '';
  QUESTIONS.forEach((q) => {
    const btn = document.createElement('button');
    btn.className = 'node';
    const r = state.results[q.id];
    if(r) btn.classList.add(r.correct ? 'up' : 'down');
    const activeQid = viewList.length ? QUESTIONS[viewList[pos]].id : null;
    if(q.id === activeQid) btn.classList.add('current');
    btn.textContent = q.id;
    btn.title = `Question ${q.id}`;
    btn.addEventListener('click', () => {
      viewList = order;
      pos = viewList.indexOf(QUESTIONS.findIndex(x=>x.id===q.id));
      if(document.getElementById('missedBtn').classList.contains('active')){
        document.getElementById('missedBtn').classList.remove('active');
      }
      renderCard();
      closeMap();
    });
    grid.appendChild(btn);
  });
}

function renderCard(){
  const host = document.getElementById('cardHost');
  if(viewList.length === 0){
    host.innerHTML = `<div class="card done-card">
      <div class="sub">No questions match this filter.</div>
      <div class="actions"><button class="navbtn primary" id="clearFilterBtn">Show all questions</button></div>
    </div>`;
    document.getElementById('clearFilterBtn').addEventListener('click', () => { setFilter(null); });
    renderStatusBar();
    return;
  }

  if(pos >= viewList.length){
    const s = computeStats();
    const cls = s.pct === null ? '' : (s.pct >= 80 ? '' : s.pct >= 50 ? 'warn' : 'crit');
    host.innerHTML = `<div class="card done-card ${cls}">
      <div class="bignum">${s.pct === null ? '—' : s.pct + '%'}</div>
      <div class="sub">${s.correct} of ${s.answered} checked this pass came back up. End of the current run.</div>
      <div class="actions">
        <button class="navbtn primary" id="restartBtn">Restart this run</button>
        <button class="navbtn" id="reviewMissedEndBtn">Review missed</button>
      </div>
    </div>`;
    document.getElementById('restartBtn').addEventListener('click', () => { pos = 0; renderAll(); });
    document.getElementById('reviewMissedEndBtn').addEventListener('click', () => { setFilter('missed'); });
    renderStatusBar();
    renderNodeGrid();
    return;
  }

  const qIndex = viewList[pos];
  const q = QUESTIONS[qIndex];
  const prior = state.results[q.id];
  locked = !!prior;
  // Only reset the in-progress selection when we've actually navigated to a
  // different question. A re-render triggered by toggling an option (same
  // question, still unlocked) must keep whatever the user just picked.
  if(renderedQid !== q.id){
    currentSelection = prior ? prior.picked.slice() : [];
    renderedQid = q.id;
  }

  const typeLabel = q.type === 'multi' ? 'select all that apply' : q.type === 'tf' ? 'true / false' : 'single answer';
  const posInRun = pos + 1;

  let optsHtml = '';
  q.options.forEach((opt, i) => {
    const isTf = q.type === 'tf';
    const picked = currentSelection.includes(i);
    let cls = 'option' + (isTf ? ' tf' : '');
    if(locked){
      cls += ' locked';
      const isCorrect = q.correct.includes(i);
      if(isCorrect) cls += ' correct';
      else if(picked && !isCorrect) cls += ' incorrect';
      else cls += ' dim';
    } else if(picked){
      cls += ' selected';
    }
    const boxContent = locked
      ? (q.correct.includes(i) ? '✓' : (picked ? '✕' : ''))
      : (picked ? '✓' : '');
    optsHtml += `<div class="${cls}" data-i="${i}">
      <div class="box">${boxContent}</div>
      <div>${opt}</div>
    </div>`;
  });

  let feedbackHtml = '';
  if(locked){
    const wasCorrect = prior.correct;
    feedbackHtml = `<div class="feedback show ${wasCorrect ? 'up' : 'down'}">
      <span class="tag">${wasCorrect ? 'UP — answered correctly' : 'DOWN — incorrect'}</span>
      ${wasCorrect ? 'Nice — that matches the correct answer.' : 'The correct answer' + (q.correct.length>1?'s are':' is') + ' highlighted in green above.'}
    </div>`;
  }

  host.innerHTML = `<div class="card">
    <div class="card-head">
      <div class="qmeta">
        <span>NODE ${String(q.id).padStart(2,'0')}</span>
        <span class="qtype-pill">${typeLabel}</span>
      </div>
      <div class="qmeta">${posInRun} / ${viewList.length} this run</div>
    </div>
    <div class="qtext">${q.q}</div>
    <div class="options">${optsHtml}</div>
    ${feedbackHtml}
    <div class="card-foot">
      <button class="navbtn" id="prevBtn" ${pos===0 ? 'disabled':''}>&larr; Previous</button>
      <span class="hint" id="hintText"></span>
      ${locked
        ? `<button class="navbtn primary" id="nextBtn">Next &rarr;</button>`
        : `<button class="navbtn submit" id="submitBtn" disabled>Check answer</button>`
      }
    </div>
  </div>`;

  // wire up option clicks
  if(!locked){
    host.querySelectorAll('.option').forEach(el => {
      el.addEventListener('click', () => {
        const i = parseInt(el.getAttribute('data-i'), 10);
        if(q.type === 'multi'){
          const idx = currentSelection.indexOf(i);
          if(idx >= 0) currentSelection.splice(idx,1);
          else currentSelection.push(i);
        } else {
          currentSelection = [i];
        }
        renderCard(); // re-render to reflect selection (cheap, 58 items)
      });
    });
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = currentSelection.length === 0;
    submitBtn.addEventListener('click', () => {
      const sortedPick = currentSelection.slice().sort();
      const sortedCorrect = q.correct.slice().sort();
      const isCorrect = sortedPick.length === sortedCorrect.length && sortedPick.every((v,idx)=>v===sortedCorrect[idx]);
      state.results[q.id] = { picked: currentSelection.slice(), correct: isCorrect };
      saveState();
      renderAll();
    });
  } else {
    document.getElementById('nextBtn').addEventListener('click', () => { pos++; renderAll(); });
  }
  document.getElementById('prevBtn').addEventListener('click', () => { pos = Math.max(0,pos-1); renderAll(); });

  renderStatusBar();
  renderNodeGrid();
}

function setFilter(mode){
  if(mode === 'missed'){
    const missedIdx = QUESTIONS
      .map((q,i)=>i)
      .filter(i => {
        const r = state.results[QUESTIONS[i].id];
        return r && !r.correct;
      });
    viewList = order.filter(i => missedIdx.includes(i));
    document.getElementById('missedBtn').classList.add('active');
  } else {
    viewList = order;
    document.getElementById('missedBtn').classList.remove('active');
  }
  pos = 0;
  renderAll();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderAll(){
  renderCard();
  renderStatusBar();
  renderNodeGrid();
}

document.getElementById('shuffleBtn').addEventListener('click', () => {
  order = shuffle(QUESTIONS.map((_,i)=>i));
  saveState();
  setFilter(null);
});
document.getElementById('orderBtn').addEventListener('click', () => {
  order = QUESTIONS.map((_,i)=>i);
  saveState();
  setFilter(null);
});
document.getElementById('missedBtn').addEventListener('click', () => {
  const active = document.getElementById('missedBtn').classList.contains('active');
  setFilter(active ? null : 'missed');
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Clear all saved progress on this device? This cannot be undone.')){
    state = { results:{}, order: null };
    order = QUESTIONS.map((_,i)=>i);
    saveState();
    pos = 0;
    setFilter(null);
  }
});

document.getElementById('mapTriggerBtn').addEventListener('click', openMap);
document.getElementById('mapCloseBtn').addEventListener('click', closeMap);
document.getElementById('mapBackdrop').addEventListener('click', (e) => {
  if(e.target.id === 'mapBackdrop') closeMap();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeMap();
});

renderAll();
</script>
